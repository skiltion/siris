name: siris
description: AI insect detector (SIRIS - Smart Insect Recognition & Identification System)
publish_to: "none"
version: 0.0.1+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 상태 관리
  provider: ^6.0.5

  # 이미지 & 카메라
  image_picker: ^1.2.0
  camera: ^0.11.0+1
  path_provider: ^2.0.14

  # 지도 & 위치
  google_maps_flutter: ^2.9.0
  geolocator: ^14.0.2
  permission_handler: ^12.0.1

  # TensorFlow Lite
  tflite_flutter: ^0.12.1

  # Firebase
  firebase_core: ^4.2.0
  cloud_firestore: ^6.0.3
  firebase_app_check: ^0.4.1+1
  firebase_database: ^12.0.3

  # HTTP 통신
  http: ^1.1.1

  # UI
  cupertino_icons: ^1.0.5

  intl: ^0.20.2
  google_mlkit_image_labeling: ^0.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/model/
    - assets/images/user_icon.png
    - assets/images/map.png
    - assets/images/more.png
    - assets/images/camera.png
